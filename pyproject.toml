[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watermarking"
version = "1.0.0"
description = "Robust localized image watermarking with hierarchical error control (refactored package)"
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "numpy==1.26.4",
    "Pillow==10.4.0",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "omegaconf==2.3.0",
    "antlr4-python3-runtime==4.9.3",
    "einops==0.8.0",
    "pycocotools==2.0.8",
    "timm==1.0.11",
    "opencv-python==4.10.0.84",
    "lpips==0.1.4",
    "scikit-image==0.24.0",
    "scikit-learn==1.5.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
wm = "watermarking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
